server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: pulsechat-backend
  threads:
    virtual:
      enabled: true
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/pulsechat}
      auto-index-creation: true

app:
  posthog:
    api-key: ${POSTHOG_API_KEY:}
    host: ${POSTHOG_HOST:https://us.i.posthog.com}
    enabled: ${POSTHOG_ENABLED:false}
    batch-size: 50
    flush-interval-ms: 5000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
